<!doctype html>
<!--
  Source for public/og-image.png (the 1200x630 social share card).
  This is the ONLY place the card is defined. To change it, edit here and re-run:
      node scripts/generate-og.js
  which screenshots this file in Chromium at exactly 1200x630 using the real
  Cabinet Grotesk fonts from public/fonts, then writes public/og-image.png.
  Editing the PNG directly means the next regeneration silently reverts it.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: 'CabinetGrotesk';
      src: url('../public/fonts/CabinetGrotesk-Regular.woff2') format('woff2');
      font-weight: 400;
    }
    @font-face {
      font-family: 'CabinetGrotesk';
      src: url('../public/fonts/CabinetGrotesk-Bold.woff2') format('woff2');
      font-weight: 700;
    }
    @font-face {
      font-family: 'CabinetGrotesk';
      src: url('../public/fonts/CabinetGrotesk-Black.woff2') format('woff2');
      font-weight: 900;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1200px;
      height: 630px;
      font-family: 'CabinetGrotesk', -apple-system, sans-serif;
      background: #1E1E1E;
      color: #ffffff;
      overflow: hidden;
      position: relative;
    }

    /* Same grain treatment the site uses on its story section */
    .grain {
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");
      pointer-events: none;
    }

    /* The lime rope motif, echoing the timeline SVG on the live site */
    .rope {
      position: absolute;
      top: -120px;
      right: -140px;
      width: 720px;
      height: 900px;
      opacity: 0.9;
    }

    .inner {
      position: relative;
      z-index: 2;
      height: 100%;
      padding: 68px 72px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .eyebrow {
      font-size: 20px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 400;
    }

    h1 {
      font-size: 96px;
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -0.02em;
      max-width: 780px;
    }

    h1 em {
      font-style: normal;
      color: #D4F534;
    }

    .sub {
      font-size: 27px;
      line-height: 1.35;
      color: rgba(255, 255, 255, 0.72);
      max-width: 660px;
      margin-top: 22px;
      font-weight: 400;
    }

    .metrics {
      display: flex;
      gap: 64px;
      align-items: flex-end;
    }

    .metric .value {
      font-size: 54px;
      font-weight: 900;
      color: #D4F534;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .metric .label {
      font-size: 17px;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 8px;
      max-width: 190px;
      line-height: 1.3;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    /* Explicit font-family here: inheriting it was falling back to a serif face
       in the headless render, which read as a different brand entirely. */
    .domain {
      font-family: 'CabinetGrotesk', -apple-system, sans-serif;
      font-size: 21px;
      color: rgba(255, 255, 255, 0.55);
      font-weight: 400;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding-bottom: 6px;
    }
  </style>
</head>
<body>
  <div class="grain"></div>

  <svg class="rope" viewBox="0 0 720 900" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path
      d="M120 -40 C 420 120, 60 300, 420 400 C 700 480, 180 620, 520 760 C 640 810, 600 900, 600 940"
      stroke="#D4F534" stroke-width="26" stroke-linecap="round" fill="none" opacity="0.85" />
  </svg>

  <div class="inner">
    <div>
      <p class="eyebrow">Mann Gupta</p>
      <h1 style="margin-top: 26px">AI Product<br /><em>Manager</em></h1>
      <p class="sub">
        I write the spec, price the tier, model the AI cost per user, and ship it.
      </p>
    </div>

    <div class="footer">
      <div class="metrics">
        <div class="metric">
          <div class="value">70%</div>
          <div class="label">Company spend cut</div>
        </div>
        <div class="metric">
          <div class="value">70%</div>
          <div class="label">Manual replies removed</div>
        </div>
        <div class="metric">
          <div class="value">3</div>
          <div class="label">Products owned 0&nbsp;to&nbsp;1</div>
        </div>
      </div>
      <div class="domain">gmannn.netlify.app</div>
    </div>
  </div>
</body>
</html>
